name: inception

services:
  mariadb:
    build: requirements/mariadb
    image: mariadb
    env_file: .env
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  wordpress:
    build: requirements/wordpress
    image: wordpress
    env_file: .env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    build: 
      context: requirements/nginx
      args: 
        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: on-failure

volumes:
  mariadb:
  wordpress:

networks:
  inception:
    driver: bridge
