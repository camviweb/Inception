events {} # for connections

http {
    include /etc/nginx/mime.types; # for html, css, png

    server {
        listen 443 ssl;
        server_name _DOMAIN_NAME_;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/ssl/certs/inception.crt;
        ssl_certificate_key /etc/ssl/private/inception.key;

        root /var/www/html; # change w/ wordpress
        index index.nginx-debian.html; # to do: change for index.php
    }
}
